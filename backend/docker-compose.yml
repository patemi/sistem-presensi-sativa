version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: iklim_postgres
    restart: always
    environment:
      POSTGRES_USER: iklim_user
      POSTGRES_PASSWORD: iklim_password
      POSTGRES_DB: iklim_db
    ports:
      - '5432:5432'
    volumes:
      - iklim_pgdata:/var/lib/postgresql/data

volumes:
  iklim_pgdata:
